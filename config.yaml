# Laptop / Ollama default
backend: "ollama"
model_name: "qwen2.5:7b"
n_abstractions_per_puzzle: 3
max_self_debug_retries: 3
n_judges: 3
total_time_budget_hours: 12
data_dir: "./data/arc-agi-2"
early_stop_after_cycles: 3
sandbox_timeout_seconds: 5
connectivity: 4
triage_enabled: true
max_effort: 4
partial_escalate_threshold: 0.5
close_escalate_threshold: 0.8
hyp_dedupe_threshold: 0.45

api:
  provider: "gemini"
  base_url: "https://generativelanguage.googleapis.com"
  api_key_env: "GEMINI_API_KEY"

ollama:
  base_url: "http://localhost:11434"

# kaggle_local defaults for local smoke.
# Qwen3-8B NF4 needs ~5GB+; on a 4GB 3050 Ti prefer Qwen3-4B for generate smoke,
# or run without max_memory on Kaggle P100 (config.kaggle.yaml).
# CPU offload of 4-bit layers is broken on Windows bitsandbytes (uint8 re-quantize).
kaggle_local:
  load_in_4bit: true
  device_map: "auto"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_use_double_quant: true
  llm_int8_enable_fp32_cpu_offload: false
