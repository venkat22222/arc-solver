# Kaggle T4 GPU — Phase 1: Multi-Candidate Sampling + Voting
backend: "kaggle_local"
model_name: "Qwen/Qwen3-8B"

# Phase 1 parameters: sample many, verify hard, vote
n_abstractions_per_puzzle: 2        # 2 hypothesis cycles (was: 3)
n_candidates_per_hypothesis: 8      # NEW: sample 8 code candidates per hypothesis
max_self_debug_retries: 1           # Reduced: only 1 debug attempt on first sample (was: 3)
n_judges: 3
total_time_budget_hours: 12
data_dir: "/kaggle/input/arc-prize-2025"
early_stop_after_cycles: 2
sandbox_timeout_seconds: 5
connectivity: 4
triage_enabled: true
max_effort: 4
partial_escalate_threshold: 0.5
close_escalate_threshold: 0.8
hyp_dedupe_threshold: 0.45

kaggle_local:
  load_in_4bit: true
  device_map: "auto"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_use_double_quant: true
  trust_remote_code: true
  llm_int8_enable_fp32_cpu_offload: false
